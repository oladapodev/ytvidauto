<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Composer</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

    <div id="app-container">
        <header>
            <h1>Video Composer</h1>
            <div id="actions">
                <button id="generate-btn" class="btn btn-primary">Export Video</button>
            </div>
        </header>

        <main>
            <!-- Sidebar: Global Settings -->
            <div id="sidebar" class="glass-panel">
                <div class="setting-group">
                    <label>Aspect Ratio</label>
                    <select id="orientation-select">
                        <option value="landscape">Landscape (16:9)</option>
                        <option value="portrait">Portrait (9:16)</option>
                    </select>
                </div>
                
                <div class="setting-group">
                    <label>Motion Style</label>
                    <select id="style-select">
                        <option value="1">Classic Zoom</option>
                        <option value="2">Cinematic Pan</option>
                        <option value="3">Vertical Scroll</option>
                        <option value="4">Static</option>
                        <option value="5">Dynamic Mix</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label>Image Scale</label>
                    <input type="range" id="image-scale" min="0.1" max="3" step="0.1" value="1">
                </div>

                <div class="setting-group">
                    <label>Audio Source</label>
                    <div id="audio-upload-zone" class="upload-zone">
                        <span id="audio-name-display">Click to upload Audio</span>
                        <input type="file" id="audio-file-input" accept="audio/*" hidden>
                    </div>
                </div>

                <div class="setting-group">
                    <label>Bulk Duration (s)</label>
                    <input type="number" id="bulk-duration-input" min="0.1" step="0.1" placeholder="Set all clips">
                </div>

                <div class="setting-group">
                    <label>Images</label>
                    <button id="add-images-btn" class="btn btn-secondary" style="width:100%">+ Add Media</button>
                    <input type="file" id="images-file-input" accept="image/*" multiple hidden>
                </div>
                
                <div style="margin-top:auto; font-size:0.75rem; color:#888;">
                    Drag edges of clips in timeline to resize duration.
                </div>
            </div>

            <!-- Editor View -->
            <div style="flex:1; display:flex; flex-direction:column; gap:1rem; min-width:0;">
                
                <!-- Preview Window -->
                <div id="preview-area" class="glass-panel">
                    <div id="video-placeholder">
                        <p style="color: #aaa;">Preview not available yet</p>
                    </div>
                </div>

                <!-- Timeline -->
                <div id="timeline-container" class="glass-panel">
                    <div id="timeline-header">
                        <span style="font-size:0.8rem; font-weight:600; color:#555;">Timeline</span>
                        <button id="reverse-timeline-btn" class="btn btn-secondary btn-sm" style="margin-left: 1rem; padding: 2px 8px; font-size: 0.7rem;">Reverse Order</button>
                        <span id="total-duration" style="margin-left:auto; font-size:0.8rem; color:#888;">00:00</span>
                    </div>
                    <div id="timeline-tracks">
                        <!-- Video Track -->
                        <div class="track" id="video-track">
                            <div class="track-label">Video</div>
                            <div id="video-track-content" style="display:flex; height:100%;"></div>
                        </div>

                        <!-- Audio Track -->
                        <div class="track" id="audio-track">
                            <div class="track-label">Audio</div>
                            <div id="audio-clip-container" style="display:flex; height:100%; align-items:center; width:100%;"></div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Status / Result Overlay -->
    <div id="status-overlay" class="hidden">
        <div class="spinner"></div>
        <h2 id="status-text" style="margin-bottom:0.5rem;">Processing...</h2>
        <p id="task-id-display" style="color:#666; font-size:0.8rem; margin-bottom:1.5rem;"></p>
        
        <div id="result-actions" class="hidden" style="display:flex; gap:1rem;">
            <a id="download-link" href="#" class="btn btn-primary" target="_blank">Download Video</a>
            <button id="reset-btn" class="btn btn-secondary">Close</button>
        </div>
    </div>

    <script src="/assets/js/app.js"></script>
</body>
</html>
