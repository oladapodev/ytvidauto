[project]
name = "ytvidauto"
version = "0.1.0"
description = "High-performance automated video generation API utilizing FastAPI and raw FFmpeg for synchronized slideshow creation."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi",
    "pydantic",
    "httpx",
    "python-multipart",
    "workers-py",
]

[project.scripts]
# This will be available as 'build' in the environment once the package is installed
build = "build_script:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicitly tell hatchling which directories to include in the package
[tool.hatch.build.targets.wheel]
packages = ["api", "core", "main.py", "index.py", "build_script.py"]
