# fly.toml for ytvidauto
# Docs: https://fly.io/docs/reference/configuration/

app = "ytvidauto"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  timeout = "10s"
  method = "get"
  path = "/api/info"

# Machine size: shared CPU, 512MB RAM (tuned for FFmpeg + FastAPI)
# Disk: 1 GB ephemeral storage for temp/images/outputs
# See fly launch / fly machine cpus for adjustments
[resources]
  memory = "512mb"
  disk_size_mb = 1024
