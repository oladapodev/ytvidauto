name: Build and Deploy to Azure

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: 'Login to Azure Container Registry'
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: 'Build and Push Image'
      run: |
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/ytvidauto:latest .
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/ytvidauto:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: 'Login to Azure'
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 'Deploy to Azure Container Instance'
      run: |
        az container create \
          --resource-group oladapodev \
          --name ytvidauto-serverless \
          --image ${{ secrets.ACR_LOGIN_SERVER }}/ytvidauto:latest \
          --cpu 1 \
          --memory 1.5 \
          --os-type Linux \
          --registry-login-server ${{ secrets.ACR_LOGIN_SERVER }} \
          --registry-username ${{ secrets.ACR_USERNAME }} \
          --registry-password ${{ secrets.ACR_PASSWORD }} \
          --dns-name-label yt-video-app-dev \
          --ports 8000 \
          --environment-variables PORT=8000